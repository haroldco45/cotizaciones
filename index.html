            </div>

                            <th style="width:150px">Referencia</th>
                            <th>Descripción</th>
                            <th style="width:70px">Cant.</th>

            <button class="btn btn-success btn-sm mb-4" onclick="agregarFila()">

                    <div class="d-flex justify-content-between mb-2"><span>Base gravable:</span><span id="txtBase">$ 0</span></div>
                    <div class="d-flex justify-content-between mb-2 text-success"><span>IVA (por producto):</span><span id="txtIva">$ 0</span></div>
                    <hr>
                    <div class="d-flex justify-content-between fw-bold fs-5"><span>TOTAL:</span><span id="txtTotal">$ 0</span></div>

            </div>
            <div class="mt-4 d-flex gap-2">

                    <i class="fas fa-save me-1"></i> Guardar Cotización
                </button>
                <button class="btn btn-outline-danger" onclick="limpiarFormulario()">
                    <i class="fas fa-times me-1"></i> Anular
                </button>
            </div>
        </div>
    </div>
    <footer class="footer-credits">
        <p>App desarrollada por <strong>VIBRAS POSITIVAS HM</strong><br>Derechos de autor (3117700431)</p>
    </footer>
</div>
