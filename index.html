<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizaciones - VIBRAS POSITIVAS HM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-header { background-color: #2e7d32; color: white; font-weight: bold; }
        .table-input { border: none; background: transparent; width: 100%; }
        .table-input:focus { outline: 1px solid #2e7d32; background: white; }
        .total-section { background: #e8f5e9; padding: 15px; border-radius: 8px; }
        .footer-credits { font-size: 0.85rem; color: #666; margin-top: 30px; text-align: center; }
    </style>
</head>
<body>

<div class="container my-4">
    <div class="card shadow">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="fas fa-file-invoice-dollar me-2"></i>COTIZACIONES A CLIENTES</span>
            <span class="badge bg-light text-dark">VIBRAS POSITIVAS HM</span>
        </div>
        <div class="card-body">
            
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Cliente</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="cliente" placeholder="Nombre o ID del cliente">
                        <button class="btn btn-outline-secondary"><i class="fas fa-search"></i></button>
                    </div>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">Vendedor</label>
                    <input type="text" class="form-control" id="vendedor" placeholder="Cód. Vendedor">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Bodega / Sucursal</label>
                    <select class="form-select" id="sucursal">
                        <option value="1">Principal - Caucasia</option>
                        <option value="2">Bodega General</option>
                    </select>
                </div>
                <div class="col-md-3 text-end">
                    <label class="form-label fw-bold">Fecha de Trabajo</label>
                    <input type="date" class="form-control" id="fechaActual">
                </div>
            </div>

            <hr>

            <div class="table-responsive">
                <table class="table table-bordered align-middle" id="tablaProductos">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 150px;">Referencia</th>
                            <th>Descripción</th>
                            <th style="width: 80px;">Cant.</th>
                            <th style="width: 150px;">Valor Unit.</th>
                            <th style="width: 100px;">Desc %</th>
                            <th style="width: 150px;">Subtotal</th>
                            <th style="width: 50px;"></th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                        </tbody>
                </table>
            </div>
            
            <button class="btn btn-success btn-sm mb-4" onclick="agregarFila()">
                <i class="fas fa-plus me-1"></i> Agregar Producto
            </button>

            <div class="row justify-content-end">
                <div class="col-md-4 total-section">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal:</span>
                        <span id="txtSubtotal">$ 0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2 text-danger">
                        <span>Descuento:</span>
                        <span id="txtDescuento">-$ 0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>IVA (19%):</span>
                        <span id="txtIva">$ 0.00</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fw-bold fs-5">
                        <span>TOTAL:</span>
                        <span id="txtTotal">$ 0.00</span>
                    </div>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-primary" onclick="guardarCotizacion()">
                    <i class="fas fa-save me-1"></i> Guardar Cotización
                </button>
                <button class="btn btn-outline-danger">
                    <i class="fas fa-times me-1"></i> Anular
                </button>
            </div>

        </div>
    </div>

    <footer class="footer-credits">
        <p>App desarrollada por <strong>VIBRAS POSITIVAS HM</strong><br>
        Derechos de autor (3117700431)</p>
    </footer>
</div>

<script>
    // Inicializar fecha
    document.getElementById('fechaActual').valueAsDate = new Date();

    function agregarFila() {
        const tbody = document.getElementById('cuerpoTabla');
        const fila = document.createElement('tr');
        fila.innerHTML = `
            <td><input type="text" class="table-input" placeholder="Ref..." onchange="buscarProducto(this)"></td>
            <td><input type="text" class="table-input" placeholder="Descripción del producto"></td>
            <td><input type="number" class="table-input" value="1" oninput="calcularTotales()"></td>
            <td><input type="number" class="table-input" value="0" oninput="calcularTotales()"></td>
            <td><input type="number" class="table-input" value="0" oninput="calcularTotales()"></td>
            <td class="fila-subtotal fw-bold">$ 0.00</td>
            <td><button class="btn btn-link text-danger p-0" onclick="this.closest('tr').remove(); calcularTotales();"><i class="fas fa-trash"></i></button></td>
        `;
        tbody.appendChild(fila);
    }

    function calcularTotales() {
        let subtotalGeneral = 0;
        let descuentoTotal = 0;
        const filas = document.querySelectorAll('#cuerpoTabla tr');

        filas.forEach(fila => {
            const inputs = fila.querySelectorAll('input');
            const cant = parseFloat(inputs[2].value) || 0;
            const precio = parseFloat(inputs[3].value) || 0;
            const descPorcentaje = parseFloat(inputs[4].value) || 0;

            const subtotalFila = cant * precio;
            const descuentoFila = subtotalFila * (descPorcentaje / 100);
            const totalFila = subtotalFila - descuentoFila;

            fila.querySelector('.fila-subtotal').innerText = `$ ${totalFila.toLocaleString()}`;
            
            subtotalGeneral += subtotalFila;
            descuentoTotal += descuentoFila;
        });

        const iva = (subtotalGeneral - descuentoTotal) * 0.19;
        const totalFinal = (subtotalGeneral - descuentoTotal) + iva;

        document.getElementById('txtSubtotal').innerText = `$ ${subtotalGeneral.toLocaleString()}`;
        document.getElementById('txtDescuento').innerText = `-$ ${descuentoTotal.toLocaleString()}`;
        document.getElementById('txtIva').innerText = `$ ${iva.toLocaleString()}`;
        document.getElementById('txtTotal').innerText = `$ ${totalFinal.toLocaleString()}`;
    }

    function guardarCotizacion() {
        alert("Enviando datos a SQL... (Aquí conectaremos la API próximamente)");
        // Aquí irá el código de fetch para conectar con tu backend
    }

    function buscarProducto(input) {
        // Esta función se activará cuando tengamos la API para buscar en tu software
        console.log("Buscando referencia: " + input.value);
    }

    // Agregar una fila inicial
    agregarFila();
</script>

</body>
</html>
